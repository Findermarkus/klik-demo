<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Asystent AI do Biblii</title>
</head>
<body style="text-align:center; font-family:Arial; padding:50px;">
  <h1>AI Biblijny Asystent</h1>
  <textarea id="prompt" rows="6" cols="60" placeholder="Wpisz temat lub pytanie biblijne..."></textarea><br><br>
  <button onclick="askAI()">Zapytaj AI</button>
  <h2>Odpowiedź:</h2>
  <div id="response" style="border:1px solid #ccc; padding:20px; margin-top:20px;"></div>

  <script>
    async function askAI() {
      const prompt = document.getElementById('prompt').value;
      document.getElementById('response').innerText = 'Czekaj...';

      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        },
        body: JSON.stringify({
          model: 'gpt-4o',
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 800
        })
      });

      const data = await response.json();
      document.getElementById('response').innerText = data.choices[0].message.content;
    }
  </script>
</body>
</html>
